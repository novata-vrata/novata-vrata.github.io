# Държи безплатния Supabase проект буден (пауза след ~7 дни без активност).
# Само чете от базата – не записва нищо. Безплатно, без тайни (ключът е публичният от сайта).
name: keepalive

on:
  schedule:
    - cron: "17 3,11,19 * * *"   # 3 пъти на ден (UTC)
  workflow_dispatch: {}

permissions:
  actions: write   # само за да поддържа самия график активен

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://hypjmhnaggqqwptlcwcd.supabase.co
      SUPABASE_KEY: sb_publishable_eWhqz8SNLI-bbSQok4cuig_zh459fWX
    steps:
      - name: Ping Supabase
        run: |
          ok=0
          for fn in ping get_votes; do
            for i in 1 2 3; do
              code=$(curl -sS -o out.json -w '%{http_code}' -m 30 -X POST "$SUPABASE_URL/rest/v1/rpc/$fn" \
                -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' || echo 000)
              echo "$fn -> $code $(head -c 200 out.json 2>/dev/null)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 20
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Supabase не отговаря (ако е 540 – проектът е паузиран: Dashboard → Resume project)"
            exit 1
          fi

      - name: Keep this schedule enabled (GitHub спира графиците след 60 дни без промени)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
